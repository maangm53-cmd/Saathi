name: Saathi CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm run install:ci

      - name: Verify source and build output
        run: npm run ci

      - name: Confirm checks left tracked source unchanged
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      # This is a release candidate, not a deployment. Public Sites publication
      # still uses the authenticated native Sites save/deploy workflow.
      - name: Package verified main commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_DIR: ${{ runner.temp }}/saathi-release-candidate
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p "$RELEASE_DIR/dist"
          # Preserve the generated hosting manifest AND D1 migration metadata.
          cp -R dist/.openai "$RELEASE_DIR/dist/.openai"
          cp -R dist/server dist/client "$RELEASE_DIR/dist/"
          git rev-parse HEAD > "$RELEASE_DIR/SOURCE_SHA"
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const provenance = {
            kind: 'release-candidate',
            deployed: false,
            sourceSha: process.env.GITHUB_SHA,
            repository: process.env.GITHUB_REPOSITORY,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            nodeVersion: process.version,
            lockfileSha256: createHash('sha256').update(readFileSync('package-lock.json')).digest('hex'),
            createdAt: new Date().toISOString(),
          };
          writeFileSync(path.join(process.env.RELEASE_DIR, 'provenance.json'), JSON.stringify(provenance, null, 2) + '\n');
          JS
          tar -czf "$RUNNER_TEMP/saathi-release-candidate.tar.gz" \
            -C "$RELEASE_DIR" dist
          cd "$RUNNER_TEMP"
          sha256sum saathi-release-candidate.tar.gz > saathi-release-candidate.tar.gz.sha256

      - name: Upload verified release candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saathi-release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/saathi-release-candidate.tar.gz
            ${{ runner.temp }}/saathi-release-candidate.tar.gz.sha256
            ${{ runner.temp }}/saathi-release-candidate/SOURCE_SHA
            ${{ runner.temp }}/saathi-release-candidate/provenance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
